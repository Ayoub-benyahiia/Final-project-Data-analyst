[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    unit: Unit tests (fast, isolated)
    data: Data integrity and DuckDB tests
    api: API endpoint tests
    benchmark: Performance benchmark tests
    integration: Integration tests
