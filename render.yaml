# =============================================================================
# TECHJOB ANALYTICS — RENDER INFRASTRUCTURE BLUEPRINT
# =============================================================================
services:
  - type: web
    name: techjob-analytics-backend
    runtime: python
    region: frankfurt # Low latency to Morocco / Europe
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
